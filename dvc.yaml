stages:
  data-cleaning:
    cmd: python -m src.data.data_cleaning
    deps:
    - data/raw/urbaneats-dataset.csv
    outs:
    - data/cleaned/urbaneats-cleaned-dataset.csv
  data-preparation:
    cmd: python -m src.data.data_preparation
    deps:
    - data/cleaned/urbaneats-cleaned-dataset.csv
    - src/data/data_preparation.py
    params:
    - Data_Preparation.random_state
    - Data_Preparation.test_size
    outs:
    - data/interim/train.csv
    - data/interim/test.csv
  feature-preprocessing:
    cmd: python -m src.features.feature_preprocessing
    deps:
    - data/interim/test.csv
    - data/interim/train.csv
    - src/features/feature_preprocessing.py
    outs:
    - data/processed/test_trans.csv
    - data/processed/train_trans.csv
    - models/preprocessor.joblib
  training-model:
    cmd: python -m src.models.train_model
    deps:
    - data/processed/train_trans.csv
    - src/models/train_model.py
    params:
    - Train.RFRegressor
    - Train.XGBRegressor
    outs:
    - models/model.joblib
    - models/stacking_regressor.joblib
    - models/power_transformer.joblib
  evaluation:
    cmd: python -m src.models.evaluate_model
    deps:
    - data/processed/train_trans.csv
    - data/processed/test_trans.csv
    - models/model.joblib
    - models/preprocessor.joblib
    outs:
    - reports/run_information.json
