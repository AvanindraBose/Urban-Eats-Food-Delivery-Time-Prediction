[project]
name = "urbaneats-delivery-time-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"

# ONLY API + INFERENCE DEPENDENCIES
dependencies = [
  # CLI (optional but lightweight)
  "typer",
  # Backend (API)
  "fastapi",
  "uvicorn",
  "pydantic",
  "pydantic[email]",
  "python-multipart",
  # Auth & security
  "python-jose[cryptography]",
  "bcrypt",
  # Database
  "sqlalchemy",
  "asyncpg",
  # Cache
  "redis",
  # MLflow & Dagshub (for remote model loading via DagsHub)
  "mlflow>=3.0",
  "dagshub",
  # Inference requirements (REQUIRED for .joblib models)
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "numpy>=1.24",
  "nltk",
  "joblib",
  # Utilities
  "pyyaml",

]

# OPTIONAL GROUPS FOR TRAINING / PIPELINES
[project.optional-dependencies]

Hptuning = [
  "optuna",
]

pipeline = [
  "dvc>=3.0",
  "dvc[s3]",
  "awscli",
  "xgboost",
]

dev = [
  "matplotlib",
  "seaborn",
  "missingno",
  "plotly",
  "nbformat>=4.2.0",
  "ipykernel>=7.2.0",
]

test = [
  "coverage",
  "httpx",
  "pytest",
  "pytest-asyncio",
  "ruff",
  "ty",
  "ipdb",
]

[project.urls]
bugs = "https://github.com/AvanindraBose/Subscribly/issues"
homepage = "https://github.com/AvanindraBose/Subscribly"

[project.scripts]
Subscribly = "Subscribly.cli:app"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.uv]
package = true
